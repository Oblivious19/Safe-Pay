<section class="login-page" aria-labelledby="register-title">
  <a class="login-brand customer-brand" href="/login" aria-label="SafePay login"><span class="customer-logo" aria-hidden="true">S<span>✓</span></span>SafePay<span class="brand-dot" aria-hidden="true">.</span></a>
  <div class="login-card">
    <p class="login-overline">GET STARTED</p><h1 id="register-title">Create your account</h1>
    <p class="login-intro">Explore simulated payments with a new savings account.</p>
    <form novalidate data-bind="submit: register, attr: {'aria-busy': submitting}">
      <div class="login-field"><label for="register-name">Full name</label><input id="register-name" name="name" autocomplete="name" maxlength="100" required data-bind="textInput: name, disable: submitting"></div>
      <div class="login-field"><label for="register-email">Email</label><input id="register-email" name="email" type="email" autocomplete="username" maxlength="150" autocapitalize="none" required data-bind="textInput: email, disable: submitting"></div>
      <div class="login-field"><label for="register-phone">Indian mobile number</label><input id="register-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" required data-bind="textInput: phone, disable: submitting"></div>
      <div class="login-field"><label for="register-password">Password</label><input id="register-password" name="password" type="password" autocomplete="new-password" required data-bind="textInput: password, disable: submitting"></div>
      <div class="login-field"><label for="register-confirm">Confirm password</label><input id="register-confirm" name="confirm-password" type="password" autocomplete="new-password" required data-bind="textInput: confirmPassword, disable: submitting"></div>
      <p class="login-message" role="alert" data-bind="visible: error, text: error"></p>
      <button class="login-submit" type="submit" data-bind="disable: submitting, text: submitting() ? 'Creating account…' : 'Create account'"></button>
    </form>
    <div class="login-registration"><span>Already registered?</span><a href="/login">Sign in</a></div>
  </div>
</section>
