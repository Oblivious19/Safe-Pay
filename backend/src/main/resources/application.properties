spring.application.name=safepay

# Runtime application connection
spring.datasource.url=${SAFEPAY_DB_URL}
spring.datasource.username=${SAFEPAY_DB_APP_USERNAME}
spring.datasource.password=${SAFEPAY_DB_APP_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate validates mappings but never creates or modifies the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=SAFEPAY_OWNER
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway uses the privileged schema owner
spring.flyway.enabled=true
spring.flyway.url=${SAFEPAY_DB_URL}
spring.flyway.user=${SAFEPAY_DB_OWNER_USERNAME}
spring.flyway.password=${SAFEPAY_DB_OWNER_PASSWORD}
spring.flyway.default-schema=SAFEPAY_OWNER
spring.flyway.schemas=SAFEPAY_OWNER
spring.flyway.locations=classpath:db/migration

# Migration safety
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true

# Do not expose detailed database health information
management.endpoint.health.show-details=never

# Durable duplicate-request replay window
safepay.idempotency.retention=PT12H

# Server-authoritative protected-transaction release scheduler
safepay.protection-scheduler.enabled=true
safepay.protection-scheduler.poll-interval=PT1S
safepay.protection-scheduler.batch-size=50

# Settlement processor policy. The processor is introduced in Phase 2.9F,
# so it remains disabled while Phases 2.9A-2.9D establish its contracts.
safepay.settlement-processor.enabled=false
safepay.settlement-processor.poll-interval=PT1S
safepay.settlement-processor.batch-size=25
safepay.settlement-processor.retry-delays[0]=PT5S
safepay.settlement-processor.retry-delays[1]=PT30S
safepay.settlement-processor.retry-delays[2]=PT1M
# Required before enabling:
# safepay.settlement-processor.outbound-clearing-account-id=${SAFEPAY_OUTBOUND_CLEARING_ACCOUNT_ID}

# Approved V1 OTP policy. These values are validated at startup and cannot
# drift from the Decision Register without an explicit code/config change.
safepay.otp.validity=PT5M
safepay.otp.max-attempts=3
safepay.otp.resend-cooldown=PT30S
safepay.otp.max-issues-per-cycle=3
safepay.otp.code-length=6

# Development Gmail delivery remains disabled unless explicitly enabled.
# Credentials and the fixed showcase recipient are supplied only through
# environment variables. FIXED_OVERRIDE prevents synthetic customer addresses
# from receiving real email; STORED_USER must be selected explicitly later.
safepay.otp.email.enabled=${SAFEPAY_OTP_EMAIL_ENABLED:false}
safepay.otp.email.from=${SAFEPAY_OTP_EMAIL_FROM:}
safepay.otp.email.routing-mode=${SAFEPAY_OTP_EMAIL_ROUTING_MODE:FIXED_OVERRIDE}
safepay.otp.email.recipient-override=${SAFEPAY_OTP_EMAIL_RECIPIENT_OVERRIDE:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SAFEPAY_OTP_EMAIL_USERNAME:}
spring.mail.password=${SAFEPAY_OTP_EMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.test-connection=false

# Durable in-app notification dispatcher. WebSocket delivery is advisory;
# notification REST APIs and Oracle remain authoritative after reconnect.
safepay.notification-dispatcher.enabled=true
safepay.notification-dispatcher.poll-interval=PT1S
safepay.notification-dispatcher.batch-size=25
safepay.notification-dispatcher.max-attempts=5
safepay.notification-dispatcher.retry-delays[0]=PT5S
safepay.notification-dispatcher.retry-delays[1]=PT30S
safepay.notification-dispatcher.retry-delays[2]=PT1M
safepay.notification-dispatcher.retry-delays[3]=PT5M

# Deferred Phase 2.2 completion: approved SafePay V1 security policy.
# The signing secret must be a randomly generated Base64 value containing at
# least 256 bits. It is never committed to source control.
safepay.security.jwt.issuer=safepay-backend
safepay.security.jwt.audience=safepay-pwa
safepay.security.jwt.secret-base64=${SAFEPAY_JWT_SECRET_BASE64}
safepay.security.jwt.access-token-validity=PT15M
safepay.security.authentication.failed-login-threshold=5
safepay.security.authentication.temporary-lock-duration=PT15M
safepay.security.authentication.refresh-session-validity=P7D
safepay.security.refresh-cookie.name=SAFEPAY_REFRESH
safepay.security.refresh-cookie.path=/api/v1/auth
safepay.security.refresh-cookie.same-site=Strict
safepay.security.refresh-cookie.secure=${SAFEPAY_REFRESH_COOKIE_SECURE:true}

# Explicit browser origins only. Credentialed wildcard CORS is prohibited.
# Add another indexed entry only for an explicitly approved local frontend.
safepay.security.browser.allowed-origins[0]=${SAFEPAY_BROWSER_ORIGIN:http://localhost:8000}
