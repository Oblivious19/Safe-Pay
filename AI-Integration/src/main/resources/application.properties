spring.application.name=SafePay Admin Assistant
server.address=127.0.0.1
server.port=${ASSISTANT_PORT:8081}
server.servlet.context-path=/assistant
server.servlet.session.cookie.name=SAFEPAY_AI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=20m
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
assistant.backend-url=${SAFEPAY_BACKEND_URL:http://127.0.0.1:8080}
assistant.ui-url=${SAFEPAY_UI_URL:http://localhost:8000/admin}
assistant.database-properties=${SAFEPAY_DATABASE_PROPERTIES:../Backend/src/main/resources/application.properties}
assistant.ollama-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
assistant.model=${OLLAMA_MODEL:qwen2.5:1.5b}
assistant.model-timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:90}
