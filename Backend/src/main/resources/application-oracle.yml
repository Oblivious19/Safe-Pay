spring:
  datasource:
    url: ${SAFEPAY_DB_URL}
    username: ${SAFEPAY_DB_USERNAME}
    password: ${SAFEPAY_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
