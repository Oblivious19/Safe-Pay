spring:
  datasource:
    # Connection details come from application.properties (or SPRING_DATASOURCE_*).
    # Do not override them with unresolved SAFEPAY_DB_* placeholders here.
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
