<section class="login-page" aria-labelledby="login-title">
  <div class="login-brand customer-brand" aria-label="SafePay"><span class="customer-logo" aria-hidden="true">S<span>✓</span></span>SafePay<span class="brand-dot" aria-hidden="true">.</span></div>
  <div class="login-card">
    <div class="login-emblem" aria-hidden="true"><svg width="26" height="30" viewBox="0 0 26 30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 23 6v8c0 7-10 13-10 13S3 21 3 14V6L13 2Z"/><path d="m8 14 3 3 7-7"/></svg></div>
    <p class="login-overline">A LITTLE MORE PEACE OF MIND</p>
    <h1 id="login-title">Welcome back</h1>
    <p class="login-intro">Sign in to your SafePay account.</p>
    <p class="auth-success" role="status" data-bind="visible: notice, text: notice"></p>
    <form novalidate data-bind="submit: login, attr: {'aria-busy': submitting}">
      <!-- ko if: mode() === 'email' -->
      <div class="login-field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required placeholder="you@example.com"
          aria-describedby="login-email-error" data-bind="textInput: email, disable: submitting, attr: {'aria-invalid': emailError() ? 'true' : 'false'}">
        <p id="login-email-error" class="login-inline-error" aria-live="polite" data-bind="text: emailError, visible: emailError"></p>
      </div>
      <!-- /ko -->
      <!-- ko if: mode() === 'phone' -->
      <div class="login-field"><label for="login-phone">Registered mobile number</label>
        <input id="login-phone" type="tel" inputmode="numeric" autocomplete="username" maxlength="10" required aria-describedby="login-phone-error" data-bind="textInput: phone, disable: submitting, attr: {'aria-invalid': !!phoneError()}">
        <p id="login-phone-error" class="login-inline-error" role="status" data-bind="text: phoneError"></p>
      </div><!-- /ko -->
      <div class="login-field">
        <label for="login-password">Password</label>
        <div class="login-password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"
          aria-describedby="login-password-error" data-bind="textInput: password, disable: submitting, attr: {type: showPassword() ? 'text' : 'password', 'aria-invalid': passwordError() ? 'true' : 'false'}">
          <button class="login-reveal" type="button" aria-controls="login-password" data-bind="click: togglePassword, disable: submitting, text: showPassword() ? 'Hide' : 'Show', attr: {'aria-label': showPassword() ? 'Hide password' : 'Show password', 'aria-pressed': showPassword() ? 'true' : 'false'}"></button>
        </div>
        <p id="login-password-error" class="login-inline-error" aria-live="polite" data-bind="text: passwordError, visible: passwordError"></p>
      </div>
      <div class="login-message" role="alert" data-bind="visible: error, text: error"></div>
      <button class="login-submit" type="submit" data-bind="disable: submitting"><span data-bind="text: submitting() ? 'Signing in…' : 'Login'"></span><span aria-hidden="true" data-bind="visible: !submitting()">↗</span></button>
      <p class="login-progress" role="status" data-bind="visible: submitting">Please wait while we sign you in.</p>
    </form>
    <button class="dashboard-secondary" type="button" data-bind="click: switchMode, disable: submitting, text: mode() === 'email' ? 'Use mobile number and password' : 'Use email and password'"></button>
    <div class="login-registration"><span>New to SafePay?</span><a href="/register">Create an account</a></div>
  </div>
  <div class="login-simulation"><span aria-hidden="true">◇</span> Simulated Environment</div>
  <p class="login-footnote">A little more control. A little more confidence.</p>
</section>
