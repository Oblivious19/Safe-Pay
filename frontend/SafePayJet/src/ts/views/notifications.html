<section class="tx-page" aria-labelledby="notifications-title"><div class="recent-heading"><div><p class="dash-overline">KEEPING YOU INFORMED</p><h1 id="notifications-title">Notifications</h1><p>Your payment updates, in one place.</p></div><button class="recipient-secondary" data-bind="click:load,disable:loading">Refresh</button></div><p role="alert" class="sp-error" data-bind="visible:error,text:error"></p><p role="status" data-bind="visible:loading">Loading your updates…</p><p data-bind="visible:!loading() && !rows().length">No notifications to show.</p><div data-bind="foreach:rows"><article class="sp-notice" data-bind="css:{unread:!read}"><small data-bind="text:$parent.date(createdAt)"></small><h2 data-bind="text:title"></h2><p data-bind="text:message"></p><div class="sp-actions"><button class="recipient-secondary" data-bind="visible:!read,click:$parent.read,disable:$parent.busy">Mark as read</button><button class="recipient-primary" data-bind="visible:transactionId,click:$parent.open">View payment</button><span data-bind="visible:read">Read</span></div></article></div><div class="sp-pagination"><button class="recipient-secondary" data-bind="click:previous,disable:loading() || page()===0">Previous</button><span data-bind="text:'Page '+(page()+1)"></span><button class="recipient-secondary" data-bind="click:next,disable:loading() || !result() || result().last">Next</button></div></section>
